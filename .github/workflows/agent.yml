name: Agent FOOTBET Stats

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # demandé toutes les 15 min ; en pratique GitHub n'en lance qu'environ 1 par heure
  workflow_dispatch: {}             # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: footbet-agent
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer l'agent
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_EVERY_HOURS: "24"
        run: python agent/agent.py
      - name: Publier les statistiques
        run: |
          git config user.name "footbet-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/fb && cp -r docs/data /tmp/fb/data && cp -r agent/cache /tmp/fb/cache
          for essai in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/data agent/cache
            cp -r /tmp/fb/data docs/data && cp -r /tmp/fb/cache agent/cache
            git add docs/data agent/cache
            if git diff --staged --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -m "Stats $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((essai * 5))
          done
          exit 1
