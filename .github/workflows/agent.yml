name: Agent FOOTBET Stats

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # toutes les 15 minutes (heure UTC), décalé des heures pleines
  workflow_dispatch: {}             # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: footbet-agent
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer l'agent
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_EVERY_HOURS: "24"
        run: python agent/agent.py
      - name: Publier les statistiques
        run: |
          git config user.name "footbet-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data agent/cache
          if git diff --staged --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Stats $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
