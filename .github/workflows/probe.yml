name: Sonde ESPN (temporaire)
on:
  push:
    branches: [claude/confident-heisenberg-wmovvo]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, urllib.request
          def g(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "footbet-agent/1.0"}), timeout=20)
              return json.loads(r.read())
          def tr(u, f=lambda d: json.dumps(d)[:1500]):
              try:
                  print("OK", u, "\n   ", f(g(u)))
              except Exception as ex:
                  print("FAIL", u, ex)
          ms = g("https://match.uefa.com/v5/matches?competitionId=14&seasonYear=2027&limit=3&offset=0&order=DESC&toDate=2026-11-03")
          fut = g("https://match.uefa.com/v5/matches?competitionId=14&seasonYear=2027&limit=3&offset=0&order=ASC&fromDate=2026-11-05&toDate=2026-11-06")
          for m in ms[:1] + fut[:1]:
              print("MATCH", m["id"], m.get("kickOffTime"), m.get("status"), sorted(m.keys()))
              tr(f"https://match.uefa.com/v5/matches/{m['id']}/lineups", lambda d: (sorted(d.keys()) if isinstance(d, dict) else type(d), d.get("lineupStatus") if isinstance(d, dict) else None, json.dumps(d)[:1800]))
          tr("https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/359/roster", lambda d: [(a["displayName"], a.get("injuries"), a.get("status")) for a in d.get("athletes", []) if a.get("injuries")][:5] or json.dumps(d.get("athletes", [{}])[0].get("status")))
          tr("https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/359/injuries")
          tr("https://sports.core.api.espn.com/v2/sports/soccer/leagues/eng.1/teams/359/injuries")
          PY
          python3 p.py
